name: (dev) [frontend] Deploy to Cloudflare Workers

on:
  push:
    branches:
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Build project
        env:
          VITE_MEMBER_MS: ${{ vars.VITE_MEMBER_MS }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: npm run build

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Pin Cloudflare account for Wrangler
        run: |
          jq --arg accountId "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            '.account_id = $accountId' \
            wrangler.jsonc > wrangler.local.jsonc

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.local.jsonc --name membership-app-frontend-dev