name: (dev) [backend] Deploy to Cloudflare Workers

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables
        run: |
          jq_filter='.d1_databases[0].database_id = $dbid0
          | .d1_databases[0].database_name = $dbname0
          | .d1_databases[1].database_id = $dbid1
          | .d1_databases[1].database_name = $dbname1
          | .d1_databases[2].database_id = $dbid2
          | .d1_databases[2].database_name = $dbname2
          | .r2_buckets[0].bucket_name = $bucketname
          | .vars.MEMBERSHIP_NUMBER_PREFIX = $mprefix
          | .vars.TELEGRAM_MS = $telegramMs
          | .vars.SMTP_HOST = $smtpHost
          | .vars.SMTP_PORT = $smtpPort
          | .vars.SMTP_USER = $smtpUser
          | .vars.FRONTEND_BASE_URL = $frontendBaseUrl
          | .vars.CORS_ALLOW_ORIGINS = $corsAllowOrigins
          | .services[0].service = $telegramMsName
          | .account_id = $accountId
          | .vectorize[0].index_name = (if $vectorizeIndex == "" then .vectorize[0].index_name else $vectorizeIndex end)
          | del(.vars.INTERNAL_SECRET, .vars.SMTP_PASS, .vars.JWT_SECRET)'

          jq \
            --arg dbid0 "${{ vars.MEMBERS_DB_ID }}" \
            --arg dbname0 "${{ vars.MEMBERS_DB_NAME }}" \
            --arg dbid1 "${{ vars.VMS_DB_ID }}" \
            --arg dbname1 "${{ vars.VMS_DB_NAME }}" \
            --arg dbid2 "${{ vars.VMS_LOGS_DB_ID }}" \
            --arg dbname2 "${{ vars.VMS_LOGS_DB_NAME }}" \
            --arg bucketname "${{ vars.BUCKET_NAME }}" \
            --arg mprefix "${{ vars.MEMBERSHIP_NUMBER_PREFIX }}" \
            --arg telegramMs "${{ vars.TELEGRAM_MS }}" \
            --arg smtpHost "${{ vars.SMTP_HOST }}" \
            --arg smtpPort "${{ vars.SMTP_PORT }}" \
            --arg smtpUser "${{ vars.SMTP_USER }}" \
            --arg frontendBaseUrl "${{ vars.FRONTEND_BASE_URL }}" \
            --arg corsAllowOrigins "${{ vars.CORS_ALLOW_ORIGINS }}" \
            --arg telegramMsName "${{ vars.TELEGRAM_MS_NAME }}" \
            --arg accountId "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            --arg vectorizeIndex "${{ vars.VECTORIZE_INDEX_NAME }}" \
            "$jq_filter" \
            wrangler.jsonc > wrangler.local.jsonc

      - name: Ensure Vectorize index exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VECTORIZE_INDEX_NAME: ${{ vars.VECTORIZE_INDEX_NAME }}
        run: bash ./scripts/ensure-vectorize-index.sh

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler.local.jsonc --name membership-app-backend-dev

      - name: Set secrets in Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.JWT_SECRET }}" | wrangler secret put JWT_SECRET --config wrangler.local.jsonc --name membership-app-backend-dev
          echo "${{ secrets.SMTP_PASS }}" | wrangler secret put SMTP_PASS --config wrangler.local.jsonc --name membership-app-backend-dev
          echo "${{ secrets.INTERNAL_SECRET }}" | wrangler secret put INTERNAL_SECRET --config wrangler.local.jsonc --name membership-app-backend-dev

      - name: Migrate D1 Databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler d1 migrations apply ${{ vars.VMS_LOGS_DB_NAME }} --remote --config wrangler.local.jsonc
          wrangler d1 migrations apply ${{ vars.MEMBERS_DB_NAME }} --remote --config wrangler.local.jsonc
          wrangler d1 migrations apply ${{ vars.VMS_DB_NAME }} --remote --config wrangler.local.jsonc