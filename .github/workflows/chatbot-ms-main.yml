name: (main) [chatbot-ms] Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'chatbot-ms/**'
      - '.github/workflows/chatbot-ms-main.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: ./chatbot-ms
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables
        run: |
          jq_filter='.d1_databases[0].database_id = $dbid
          | .d1_databases[0].database_name = $dbname
          | .vectorize[0].index_name = $vectorizeIndex
          | .vars.CORS_ALLOW_ORIGINS = $corsAllowOrigins
          | .vars.WEBSITE_BASE_URL = $websiteBaseUrl
          | .vars.MEMBERS_SITE_URL = $membersSiteUrl
          | .vars.WEBSITE_INGEST_URLS = $websiteIngestUrls
          | .vars.CHAT_MODEL = $chatModel
          | .vars.EMBEDDING_MODEL = $embeddingModel
          | .vars.RAG_TOP_K = $ragTopK
          | .account_id = $accountId
          | del(.vars.INTERNAL_SECRET)'

          jq \
            --arg dbid "${{ vars.VMS_DB_ID }}" \
            --arg dbname "vms-database" \
            --arg vectorizeIndex "ibtikar-chatbot" \
            --arg corsAllowOrigins "https://ibtikar.tr" \
            --arg websiteBaseUrl "https://ibtikar.org.tr" \
            --arg membersSiteUrl "https://ibtikar.tr" \
            --arg websiteIngestUrls "https://ibtikar.org.tr,https://ibtikar.org.tr/,https://ibtikar.tr,https://ibtikar.tr/signup,https://ibtikar.tr/telegram-bot" \
            --arg chatModel "@cf/google/gemma-4-26b-a4b-it" \
            --arg embeddingModel "@cf/baai/bge-m3" \
            --arg ragTopK "8" \
            --arg accountId "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            "$jq_filter" \
            wrangler.jsonc > wrangler.local.jsonc

      - name: Ensure Vectorize index exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VECTORIZE_INDEX_NAME: ibtikar-chatbot
          WRANGLER_CONFIG: wrangler.local.jsonc
        run: bash ./scripts/ensure-vectorize-index.sh

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler.local.jsonc --name chatbot-ms

      - name: Set secrets in Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.INTERNAL_SECRET }}" | wrangler secret put INTERNAL_SECRET --config wrangler.local.jsonc --name chatbot-ms
