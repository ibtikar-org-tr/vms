name: (main) [backend] Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-main.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables
        run: |
          jq_filter='.d1_databases[0].database_id = $dbid0
          | .d1_databases[0].database_name = $dbname0
          | .d1_databases[1].database_id = $dbid1
          | .d1_databases[1].database_name = $dbname1
          | .d1_databases[2].database_id = $dbid2
          | .d1_databases[2].database_name = $dbname2
          | .r2_buckets[0].bucket_name = $bucketname
          | .vars.MEMBERSHIP_NUMBER_PREFIX = $mprefix
          | .vars.TELEGRAM_MS = $telegramMs
          | .vars.SMTP_HOST = $smtpHost
          | .vars.SMTP_PORT = $smtpPort
          | .vars.SMTP_USER = $smtpUser
          | .vars.FRONTEND_BASE_URL = $frontendBaseUrl
          | .vars.CORS_ALLOW_ORIGINS = $corsAllowOrigins
          | .vars.AUTHDEEP_API_BASE = (if $authdeepApiBase == "" then .vars.AUTHDEEP_API_BASE else $authdeepApiBase end)
          | .vars.AUTHDEEP_TENANT_ID = (if $authdeepTenantId == "" then .vars.AUTHDEEP_TENANT_ID else $authdeepTenantId end)
          | .vars.AUTHDEEP_MAIL_FROM = (if $authdeepMailFrom == "" then .vars.AUTHDEEP_MAIL_FROM else $authdeepMailFrom end)
          | .services[0].service = $telegramMsName
          | .account_id = $accountId
          | .vectorize[0].index_name = (if $vectorizeIndex == "" then .vectorize[0].index_name else $vectorizeIndex end)
          | .queues.producers[0].queue = (if $queueName == "" then .queues.producers[0].queue else $queueName end)
          | .queues.consumers[0].queue = (if $queueName == "" then .queues.consumers[0].queue else $queueName end)
          | .queues.consumers[0].dead_letter_queue = (if $dlqName == "" then .queues.consumers[0].dead_letter_queue else $dlqName end)
          | del(.vars.INTERNAL_SECRET, .vars.SMTP_PASS, .vars.JWT_SECRET, .vars.AUTHDEEP_API_TOKEN, .vars.AUTHDEEP_HMAC_SECRET)'

          jq \
            --arg dbid0 "${{ vars.MEMBERS_DB_ID }}" \
            --arg dbname0 "${{ vars.MEMBERS_DB_NAME }}" \
            --arg dbid1 "${{ vars.VMS_DB_ID }}" \
            --arg dbname1 "${{ vars.VMS_DB_NAME }}" \
            --arg dbid2 "${{ vars.VMS_LOGS_DB_ID }}" \
            --arg dbname2 "${{ vars.VMS_LOGS_DB_NAME }}" \
            --arg bucketname "${{ vars.BUCKET_NAME }}" \
            --arg mprefix "${{ vars.MEMBERSHIP_NUMBER_PREFIX }}" \
            --arg telegramMs "${{ vars.TELEGRAM_MS }}" \
            --arg smtpHost "${{ vars.SMTP_HOST }}" \
            --arg smtpPort "${{ vars.SMTP_PORT }}" \
            --arg smtpUser "${{ vars.SMTP_USER }}" \
            --arg authdeepApiBase "${{ vars.AUTHDEEP_API_BASE }}" \
            --arg authdeepTenantId "${{ vars.AUTHDEEP_TENANT_ID }}" \
            --arg authdeepMailFrom "${{ vars.AUTHDEEP_MAIL_FROM }}" \
            --arg frontendBaseUrl "${{ vars.FRONTEND_BASE_URL }}" \
            --arg corsAllowOrigins "${{ vars.CORS_ALLOW_ORIGINS }}" \
            --arg telegramMsName "${{ vars.TELEGRAM_MS_NAME }}" \
            --arg accountId "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            --arg vectorizeIndex "${{ vars.VECTORIZE_INDEX_NAME }}" \
            --arg queueName "${{ vars.THIS_APP_NAME_BE }}-assembly-announcements" \
            --arg dlqName "${{ vars.THIS_APP_NAME_BE }}-assembly-announcements-dlq" \
            "$jq_filter" \
            wrangler.jsonc > wrangler.local.jsonc

      - name: Ensure Vectorize index exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VECTORIZE_INDEX_NAME: ${{ vars.VECTORIZE_INDEX_NAME }}
          WRANGLER_CONFIG: wrangler.local.jsonc
        run: bash ./scripts/ensure-vectorize-index.sh

      - name: Ensure assembly announcement queue exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ASSEMBLY_QUEUE_NAME: ${{ vars.THIS_APP_NAME_BE }}-assembly-announcements
          ASSEMBLY_DLQ_NAME: ${{ vars.THIS_APP_NAME_BE }}-assembly-announcements-dlq
          WRANGLER_CONFIG: wrangler.local.jsonc
        run: bash ./scripts/ensure-assembly-queue.sh

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler.local.jsonc --name ${{ vars.THIS_APP_NAME_BE }}

      - name: Set secrets in Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.JWT_SECRET }}" | wrangler secret put JWT_SECRET --config wrangler.local.jsonc --name ${{ vars.THIS_APP_NAME_BE }}
          echo "${{ secrets.SMTP_PASS }}" | wrangler secret put SMTP_PASS --config wrangler.local.jsonc --name ${{ vars.THIS_APP_NAME_BE }}
          echo "${{ secrets.INTERNAL_SECRET }}" | wrangler secret put INTERNAL_SECRET --config wrangler.local.jsonc --name ${{ vars.THIS_APP_NAME_BE }}
          if [ -n "${{ secrets.AUTHDEEP_API_TOKEN }}" ]; then
            echo "${{ secrets.AUTHDEEP_API_TOKEN }}" | wrangler secret put AUTHDEEP_API_TOKEN --config wrangler.local.jsonc --name ${{ vars.THIS_APP_NAME_BE }}
          fi
          if [ -n "${{ secrets.AUTHDEEP_HMAC_SECRET }}" ]; then
            echo "${{ secrets.AUTHDEEP_HMAC_SECRET }}" | wrangler secret put AUTHDEEP_HMAC_SECRET --config wrangler.local.jsonc --name ${{ vars.THIS_APP_NAME_BE }}
          fi

      - name: Migrate D1 Databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler d1 migrations apply ${{ vars.VMS_LOGS_DB_NAME }} --remote --config wrangler.local.jsonc
          wrangler d1 migrations apply ${{ vars.MEMBERS_DB_NAME }} --remote --config wrangler.local.jsonc
          wrangler d1 migrations apply ${{ vars.VMS_DB_NAME }} --remote --config wrangler.local.jsonc